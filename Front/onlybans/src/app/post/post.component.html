<ng-container *ngIf="displayedPosts && displayedPosts.length > 0">
<div id="post-management">
    <div *ngFor="let p of displayedPosts trackBy: trackByPostId" class="post-card">
    
      <div class="post-header">
        <strong>
          <a [routerLink]="['/profile', p.user?.id]" (click)="$event.stopPropagation()" class="username-link">
            {{ p.usernameDisplay }}
          </a>
        </strong>
        <span class="post-date">{{ p.creationDateTime | date:'short' }}</span>
      </div>

      <div class="post-image">
        <img *ngIf="p.imagePath" [src]="p.imagePath" alt="Post Image" [routerLink]="['/post', p.id]">
      </div>

      <div class="post-content">
        <p>{{ p.description }}</p>
      </div>

      <div class="post-footer">
        <div class="like-section">
          <button 
            (click)="likePost(p);  $event.stopPropagation()" 
            [ngClass]="{'liked': p.isLikedByCurrentUser}"
            class="like-button">
            {{ p.isLikedByCurrentUser ? 'Liked' : 'Like' }}
          </button>

          <span class="likes-link" (click)="toggleLikesList(p.id)"> {{ p.likeCount || 0 }} Likes</span>
        </div>

        <div *ngIf="isLikesListOpened" class="overlay" (click)="closeLikesList()">
          <div class="modal" (click)="$event.stopPropagation()">
            <h3>Likes</h3>
            <ul>
              <li *ngFor="let user of likes$ | async">
                <a [routerLink]="['/profile', user.id]">{{ user.username }}</a>
              </li>
            </ul>
          </div>
        </div>

        <div class="comment-section">
          <textarea [(ngModel)]="commentText[p.id]" (click)="$event.stopPropagation()" placeholder="Add a comment..."></textarea>
          <button (click)="addComment(p)" (click)="$event.stopPropagation()" class="comment-button">
            Add Comment
          </button>
        </div>
      </div>
    </div>

  <ng-template #noPosts>
    <div class="no-posts-message">
      No posts yet.
    </div>
  </ng-template>
</div>
</ng-container>
