<div id="post-management" style="display: flex; flex-wrap: wrap; gap: 20px;">
  <div *ngIf="displayedPosts.length > 0; else noPosts">
    <div *ngFor="let p of displayedPosts" class="post-card"
       
        style="border: 1px solid #ccc;
        border-radius: 8px; padding: 16px; width: 300px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
    
      <div class="post-header">
        <strong>
          <a [routerLink]="['/profile', p.user?.id]"
            (click)="$event.stopPropagation()"
            style="text-decoration: none; color: #007bff;">
            {{ p.usernameDisplay }}
          </a>
        </strong>
        <span style="float: right; color: #888;">{{ p.creationDateTime | date:'short' }}</span>
      </div>

      <div class="post-image" style="text-align: center; margin: 16px 0;">
        <img *ngIf="p.imagePath" 
            [src]="p.imagePath" alt="Post Image" style="max-width: 100%; border-radius: 8px;"
            [routerLink]="['/post', p.id]">
      </div>
      
      <div class="post-content">
        <p>{{ p.description }}</p>
      </div>

      <div class="post-footer" style="color: #888; font-size: 0.9em;">
        <div style="margin-top: 10px;">
          <!-- Liked button, changes color if post is liked -->
          <button 
            (click)="likePost(p);  $event.stopPropagation()" 
            [ngClass]="{'liked': p.isLikedByCurrentUser}"
            style="background-color: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
            {{ p.isLikedByCurrentUser ? 'Liked' : 'Like' }}
          </button>

          <span style="margin-left: 8px;" class="likes-link" (click)="toggleLikesList(p.id)"> {{ p.likeCount || 0 }} Likes</span>

        </div>

        <div *ngIf="isLikesListOpened" class="overlay" (click)="closeLikesList()">
          <div class="modal" (click)="$event.stopPropagation()">
            <h3>Likes</h3>
            <ul>
              <li *ngFor="let user of likes$ | async">
                <a [routerLink]="['/profile', user.id]">{{user.username}}</a>
              </li>
            </ul>
          </div>
        </div>

        <div class="comment-section" style="margin-top: 15px;">
          <textarea [(ngModel)]="commentText[p.id]" (click)="$event.stopPropagation()" placeholder="Add a comment..." style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
          <button (click)="addComment(p)" (click)="$event.stopPropagation()" style="background-color: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 8px;">
            Add Comment
          </button>
        </div>
      </div>
    </div>
  </div>

   <!-- Ako nema postova -->
  <ng-template #noPosts>
    <div style="text-align: center; width: 100%; padding: 20px; color: #888;">
      No posts yet.
    </div>
  </ng-template>
</div>
